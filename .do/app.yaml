# DigitalOcean App Platform spec for LeafScan.
#
# Create the app with:
#   doctl apps create --spec .do/app.yaml
# or import this file in the App Platform UI ("Create App" → "Edit Your App Spec").
#
# WHY dockerfile_path over a buildpack: the app needs an exact CPU-only torch
# build (see Dockerfile) — buildpacks can't express that, so we ship our own image.
name: leafscan
region: fra
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: adikoren/plant-disease-detection-pytorch
      branch: deploy/digitalocean-live
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 15
    routes:
      - path: /
